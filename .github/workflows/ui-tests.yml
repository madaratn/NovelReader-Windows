name: UI tests
on:
  push:
    branches-ignore:
      - 'screens/**'
  pull_request:
  workflow_dispatch:
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # the UI tests run the renderer in Chromium, not Electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Type check (TypeScript)
        run: npm run typecheck
      - name: Every UI string has a French translation
        run: npm run check:i18n
      - name: Unit tests (main-process modules)
        run: npm run test:unit
      - name: Build renderer
        run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run UI tests
        run: npm run test:ui
      - name: Android interface (phone layout, books without Electron)
        run: npm run build:android && npx playwright test -c playwright.android.config.ts
      # Watch party over the real public PeerJS server: depends on an outside
      # service, so it reports but does not block.
      - name: Live watch party (PeerJS)
        continue-on-error: true
        env:
          LIVE_PEER: '1'
        run: npx playwright test tests/ui/watch-party-live.spec.ts
      - name: Upload report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
