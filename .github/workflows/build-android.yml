name: Build Android APK
# - push to any branch / manual run: builds the APK and attaches it to the run
# - manual run on main with "publish" ticked: also uploads NovelReader-<version>.apk
#   to the GitHub Release v<package.json version> (created if missing).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the APK to the GitHub Release for the version in package.json (main only)
        type: boolean
        default: false
  push:
    branches-ignore:
      - 'screens/**'
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'vite.config.ts'
      - 'package.json'
      - '.github/workflows/build-android.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest already has the Android SDK (ANDROID_HOME).
      - run: npm install
      - name: Build the app interface for Android
        run: npm run build:android
      - name: Copy it into the Android project
        run: npx cap sync android
      - name: Build the signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || unset ANDROID_KEYSTORE_PASSWORD
          [ -n "$ANDROID_KEY_PASSWORD" ] || unset ANDROID_KEY_PASSWORD
          chmod +x gradlew
          ./gradlew --no-daemon --init-script ci/mirror.init.gradle assembleRelease
          v=$(node -p "require('../package.json').version")
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk "../release/NovelReader-$v.apk"
      - name: Check the APK (signature, interface inside)
        run: |
          apk=$(ls release/*.apk)
          unzip -l "$apk" | grep -E "assets/public/index.html|assets/capacitor.config.json"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$apk" | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: NovelReader-Android
          path: release/*.apk
          if-no-files-found: error
      - name: Upload the APK to the release
        if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          gh release view "v$v" >/dev/null 2>&1 || gh release create "v$v" --target "$GITHUB_SHA" --title "NovelReader $v" --notes-file build/release-notes.md
          gh release upload "v$v" "release/NovelReader-$v.apk" --clobber

  # Installs the APK on an emulator, opens it and checks that the interface shows
  # (WebView text is in the accessibility tree) with no JavaScript error.
  smoke:
    needs: apk
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NovelReader-Android
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r NovelReader-*.apk
            adb logcat -c
            adb shell am start -n com.madaratn.novelreader/.MainActivity
            sleep 40
            mkdir -p shots; adb exec-out screencap -p > shots/android-start.png
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null; adb pull /sdcard/ui.xml ui.xml >/dev/null
            echo "--- texts on screen"; grep -o 'text="[^"]*"' ui.xml | grep -v 'text=""' | head -40
            echo "--- web console"; adb logcat -d | grep -iE 'capacitor|chromium|console|novelreader|AndroidRuntime' | tail -80
            cp ui.xml shots/ || true
            grep -qE 'Global Search|Recherche globale' ui.xml
            ! adb logcat -d | grep -E 'Capacitor/Console.*(Uncaught|TypeError|ReferenceError|SyntaxError)'
      # Screenshot readable without downloading the artifact.
      - name: Publish the screenshot to a branch
        if: always()
        shell: bash
        run: |
          [ -d shots ] || exit 0
          BR="screens/android-${GITHUB_REF_NAME//\//-}"
          cd shots && git init -q && git checkout -q -b "$BR"
          git add . && git -c user.name=ci -c user.email=ci@local commit -qm "android screenshot for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$BR"
