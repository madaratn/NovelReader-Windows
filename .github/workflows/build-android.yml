name: Build Android APK
# - push to any branch / manual run: builds the APK and attaches it to the run
# - manual run on main with "publish" ticked: also uploads NovelReader-<version>.apk
#   to the GitHub Release v<package.json version> (created if missing).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the APK to the GitHub Release for the version in package.json (main only)
        type: boolean
        default: false
  push:
    branches-ignore:
      - 'screens/**'
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'vite.config.ts'
      - 'package.json'
      - '.github/workflows/build-android.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm install
      - name: Build the app interface for Android
        run: npm run build:android
      - name: Copy it into the Android project
        run: npx cap sync android
      - name: Build the signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || unset ANDROID_KEYSTORE_PASSWORD
          [ -n "$ANDROID_KEY_PASSWORD" ] || unset ANDROID_KEY_PASSWORD
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          v=$(node -p "require('../package.json').version")
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk "../release/NovelReader-$v.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: NovelReader-Android
          path: release/*.apk
          if-no-files-found: error
      - name: Upload the APK to the release
        if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          gh release view "v$v" >/dev/null 2>&1 || gh release create "v$v" --target "$GITHUB_SHA" --title "NovelReader $v" --notes-file build/release-notes.md
          gh release upload "v$v" "release/NovelReader-$v.apk" --clobber
