name: Build Android APK
# - push to any branch / manual run: builds the APK and attaches it to the run
# - manual run on main with "publish" ticked: also uploads NovelReader-<version>.apk
#   to the GitHub Release v<package.json version> (created if missing).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the APK to the GitHub Release for the version in package.json (main only)
        type: boolean
        default: false
      diag_source:
        description: 'Emulator: video source to diagnose (name, e.g. Anikage)'
        type: string
        default: ''
      sweep:
        description: 'Emulator: try every source that works on the PC (slow)'
        type: boolean
        default: false
      diag_query:
        description: 'Emulator: title to search with that source'
        type: string
        default: ''
  push:
    branches-ignore:
      - 'screens/**'
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'scripts/android-*'
      - 'scripts/engine-patches/**'
      - '.github/workflows/build-patched-miwayomi.yml'
      - 'vite.config.ts'
      - 'package.json'
      - '.github/workflows/build-android.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest already has the Android SDK (ANDROID_HOME).
      # Retried: a native module (node-datachannel) sometimes fails to download its prebuilt binary.
      - run: npm install || { sleep 20; npm install; } || { sleep 60; npm install; }
        shell: bash
      - name: Build the app interface for Android
        run: npm run build:android
      - name: Prepare the video engine sources (PC engine + patches, for Android)
        run: python3 -m pip install --quiet pyyaml 2>/dev/null || true; python3 scripts/android-engine.py
      - name: Copy it into the Android project
        run: npx cap sync android
      - name: Build the signed APK
        working-directory: android
        # Private key from the repo secrets (ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD).
        # Without them (forks), the public test key in android/app is used, and a
        # release cannot be published with it.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PW" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore" ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PW" ANDROID_KEY_PASSWORD="$KEYSTORE_PW"
            echo "Signing with the private key"
          elif [ "$PUBLISH" = "true" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets before publishing"; exit 1
          else
            echo "::warning::No private key in the secrets: signed with the public test key"
          fi
          chmod +x gradlew
          ./gradlew --no-daemon --init-script ci/mirror.init.gradle :engine:testReleaseUnitTest assembleRelease || { echo "::warning::retrying once (network)"; sleep 20; ./gradlew --no-daemon --init-script ci/mirror.init.gradle :engine:testReleaseUnitTest assembleRelease; }
          v=$(node -p "require('../package.json').version")
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk "../release/NovelReader-$v.apk"
      - name: Check the APK (signature, interface inside)
        run: |
          apk=$(ls release/*.apk)
          unzip -l "$apk" | grep -E "assets/public/index.html|assets/capacitor.config.json"
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$apk" | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: NovelReader-Android
          path: release/*.apk
          if-no-files-found: error
      - name: Upload the APK to the release
        if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          gh release view "v$v" >/dev/null 2>&1 || gh release create "v$v" --target "$GITHUB_SHA" --title "NovelReader $v" --notes-file build/release-notes.md
          gh release upload "v$v" "release/NovelReader-$v.apk" --clobber

  # Installs the APK on an emulator, opens it and checks that the interface shows
  # (WebView text is in the accessibility tree) with no JavaScript error.
  smoke:
    needs: apk
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: NovelReader-Android
      - name: Fake Cloudflare-protected site (for the emulator)
        run: nohup python3 scripts/fake-cloudflare.py >/dev/null 2>&1 &
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: SWEEP='${{ inputs.sweep }}' DIAG_SOURCE='${{ inputs.diag_source }}' DIAG_QUERY='${{ inputs.diag_query }}' bash scripts/android-smoke.sh
      # Screenshot readable without downloading the artifact.
      - name: Publish the screenshot to a branch
        if: always()
        shell: bash
        run: |
          [ -d shots ] || exit 0
          BR="screens/android-${GITHUB_REF_NAME//\//-}"
          cd shots && git init -q && git checkout -q -b "$BR"
          git add . && git -c user.name=ci -c user.email=ci@local commit -qm "android screenshot for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$BR"
