name: Tunisian TV catalog
# Lists the series the Tunisian channels publish on their official YouTube channels
# (public pages, no video downloaded) and publishes the catalog the app reads, so the
# "Tunisian TV" source needs no YouTube key. Weekly, or by hand.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the catalog for the app (branch catalog/tntv)
        type: boolean
        default: false
      max_playlists:
        description: Playlists per channel at most
        default: '400'
  schedule:
    - cron: '41 2 * * 2,5'
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install yt-dlp
        run: python3 -m pip install --quiet --upgrade yt-dlp
      - name: Build the catalog
        env:
          TNTV_MAX_PLAYLISTS: ${{ inputs.max_playlists || '400' }}
        run: python3 scripts/tntv-catalog.py tntv
      - name: Summary
        if: always()
        run: |
          ls -la tntv 2>/dev/null || true
          [ -f tntv/tntv-catalog.json ] && python3 -c "import json;c=json.load(open('tntv/tntv-catalog.json'));print(json.dumps(c['channels'],ensure_ascii=False));[print(p['channel'],'|',p['count'],'|',p['title']) for p in c['playlists'][:60]]" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tntv-catalog
          path: tntv
      # A branch (not a release): raw.githubusercontent.com can be read by the app on the PC too.
      - name: Publish for the app
        if: ${{ inputs.publish || github.event_name == 'schedule' }}
        run: |
          cd tntv && git init -q && git checkout -q -b catalog/tntv
          git add . && git -c user.name=ci -c user.email=ci@local commit -qm "Tunisian TV catalog $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" catalog/tntv
