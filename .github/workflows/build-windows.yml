name: Build Windows EXE
# - push to main / manual run: builds the installer and attaches it to the run
# - push of a tag vX.Y.Z: also publishes a GitHub Release (installer +
#   latest.yml) that installed copies of NovelReader update from automatically.
#   The tag must match "version" in package.json.
# - manual run on main with "publish" ticked: same release, tagged
#   v<package.json version> by electron-builder (no tag push needed).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub Release for the version in package.json (main only)
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    # A normal build takes ~10 min; a stalled download should fail, not hang for 6 h.
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write      # build provenance (proof that the installer was built here)
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # No `cache: npm` here: it fails when package-lock.json is not committed.
      # Retried: a native module (node-datachannel) sometimes fails to download its prebuilt binary.
      - run: npm install || { sleep 20; npm install; } || { sleep 60; npm install; }
        shell: bash
      # Never ship a Windows installer if type checks, translations or unit tests fail.
      - name: TypeScript type check
        run: npm run typecheck
      - name: French translations
        run: npm run check:i18n
      - name: Unit tests
        run: npm run test:unit
      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version $v"; exit 1; fi
      - name: Refuse to publish from another branch than main
        if: ${{ inputs.publish && github.ref != 'refs/heads/main' }}
        shell: bash
        run: echo "::error::Releases are published from main only"; exit 1
      - name: Build installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && !inputs.publish }}
        run: npm run dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Create the release (with its notes) before electron-builder uploads the
      # files: otherwise it creates it twice in parallel and one upload fails.
      - name: Create the GitHub Release with its notes
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          if gh release view "v$v" >/dev/null 2>&1; then
            gh release edit "v$v" --title "NovelReader $v" --notes-file build/release-notes.md
          else
            gh release create "v$v" --target "$GITHUB_SHA" --title "NovelReader $v" --notes-file build/release-notes.md
          fi
      # Code signing: used as soon as the repository has the secrets WIN_CSC_LINK
      # (the certificate, .pfx in base64) and WIN_CSC_KEY_PASSWORD. Without them the
      # installer is built unsigned, as before (see docs/TRUST.md).
      - name: Build and publish release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
        shell: bash
        run: |
          if [ -n "$WIN_CSC_LINK" ]; then export CSC_LINK="$WIN_CSC_LINK" CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD"; echo "Signing with the repository certificate"; else echo "::notice::No signing certificate: the installer is not signed (docs/TRUST.md)"; fi
          npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      # Anyone can check that the file they downloaded is the one built here:
      # SHA256SUMS.txt in the release, and a signed build provenance on GitHub.
      - name: Publish the checksums
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          (cd release && sha256sum "NovelReader-Setup-$v.exe" > "SHA256SUMS-windows.txt" && cat "SHA256SUMS-windows.txt")
          gh release upload "v$v" "release/SHA256SUMS-windows.txt" --clobber
      - name: Build provenance
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/NovelReader-Setup-*.exe
      # Optional: with the secret VT_API_KEY, the installer is sent to VirusTotal and
      # the report link is written in the run summary.
      - name: Antivirus report (VirusTotal)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
        continue-on-error: true
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          [ -n "$VT_API_KEY" ] || { echo "No VT_API_KEY secret: skipped"; exit 0; }
          v=$(node -p "require('./package.json').version")
          f="release/NovelReader-Setup-$v.exe"
          url=$(curl -sS -H "x-apikey: $VT_API_KEY" https://www.virustotal.com/api/v3/files/upload_url | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).data")
          curl -sS -H "x-apikey: $VT_API_KEY" -F "file=@$f" "$url" >/dev/null
          sha=$(sha256sum "$f" | cut -d' ' -f1)
          echo "VirusTotal report: https://www.virustotal.com/gui/file/$sha" | tee -a "$GITHUB_STEP_SUMMARY"
      # Interface-only update (applied without closing the app, electron/ui-update.cjs).
      - name: Publish the interface bundle
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          node scripts/ui-bundle.mjs
          gh release upload "v$v" release/ui.json "release/ui-$v.json.gz" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: NovelReader-Windows
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
