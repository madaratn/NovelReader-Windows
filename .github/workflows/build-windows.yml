name: Build Windows EXE
# - push to main / manual run: builds the installer and attaches it to the run
# - push of a tag vX.Y.Z: also publishes a GitHub Release (installer +
#   latest.yml) that installed copies of NovelReader update from automatically.
#   The tag must match "version" in package.json.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
jobs:
  windows:
    runs-on: windows-latest
    # A normal build takes ~10 min; a stalled download should fail, not hang for 6 h.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # No `cache: npm` here: it fails when package-lock.json is not committed.
      - run: npm install
      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version $v"; exit 1; fi
      - name: Build installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: NovelReader-Windows
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
