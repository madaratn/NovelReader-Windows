name: Build Windows EXE
# - push to main / manual run: builds the installer and attaches it to the run
# - push of a tag vX.Y.Z: also publishes a GitHub Release (installer +
#   latest.yml) that installed copies of NovelReader update from automatically.
#   The tag must match "version" in package.json.
# - manual run on main with "publish" ticked: same release, tagged
#   v<package.json version> by electron-builder (no tag push needed).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub Release for the version in package.json (main only)
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['v*']
jobs:
  windows:
    runs-on: windows-latest
    # A normal build takes ~10 min; a stalled download should fail, not hang for 6 h.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # No `cache: npm` here: it fails when package-lock.json is not committed.
      # Retried: a native module (node-datachannel) sometimes fails to download its prebuilt binary.
      - run: npm install || { sleep 20; npm install; } || { sleep 60; npm install; }
        shell: bash
      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version $v"; exit 1; fi
      - name: Refuse to publish from another branch than main
        if: ${{ inputs.publish && github.ref != 'refs/heads/main' }}
        shell: bash
        run: echo "::error::Releases are published from main only"; exit 1
      - name: Build installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && !inputs.publish }}
        run: npm run dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Create the release (with its notes) before electron-builder uploads the
      # files: otherwise it creates it twice in parallel and one upload fails.
      - name: Create the GitHub Release with its notes
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          if gh release view "v$v" >/dev/null 2>&1; then
            gh release edit "v$v" --title "NovelReader $v" --notes-file build/release-notes.md
          else
            gh release create "v$v" --target "$GITHUB_SHA" --title "NovelReader $v" --notes-file build/release-notes.md
          fi
      - name: Build and publish release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Interface-only update (applied without closing the app, electron/ui-update.cjs).
      - name: Publish the interface bundle
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          node scripts/ui-bundle.mjs
          gh release upload "v$v" release/ui.json "release/ui-$v.json.gz" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: NovelReader-Windows
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
