name: Test Internet Archive torrent streaming
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # same major as Electron 34's embedded Node
      - run: npm install
      - name: Torrent layer end-to-end (plain Node)
        run: |
          set +e
          npm run test:torrent > torrent-test.log 2>&1; code=$?
          cat torrent-test.log
          # Surface the output as an annotation (readable from the checks API).
          echo "::notice title=torrent-test::$(tail -n 60 torrent-test.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
          exit $code
      - name: Build renderer
        run: npm run build
      - name: Electron startup smoke test (sandbox kept on)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb >/dev/null
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          NR_SMOKE_TEST=1 NR_SMOKE_ARCHIVE_ID=popeye_taxi-turvey NR_SMOKE_VIDEO_DIR=tests/ui/fixtures timeout 180 xvfb-run -a npx electron . > electron.log 2>&1
          cat electron.log
          echo "::notice title=electron-smoke::$(grep -v 'dbus\|Fontconfig\|libva' electron.log | tail -n 40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
          grep -q 'SMOKE_RESULT {"bridge":true.*"ok":true' electron.log
