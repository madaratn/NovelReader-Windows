name: Test Internet Archive torrent streaming
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # same major as Electron 34's embedded Node
      - run: npm install
      - name: Torrent layer end-to-end (plain Node)
        run: npm run test:torrent
      - name: Build renderer
        run: npm run build
      - name: Electron startup smoke test (sandbox kept on)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb >/dev/null
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          NR_SMOKE_TEST=1 NR_SMOKE_ARCHIVE_ID=popeye_taxi-turvey timeout 180 xvfb-run -a npx electron . 2>&1 | tee electron.log
          grep -q 'SMOKE_RESULT {"bridge":true.*"ok":true' electron.log
