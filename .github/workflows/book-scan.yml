name: Book source scan
# Checks every LNReader book source as the PC app runs them (popular list, a novel,
# its first chapter). Twice a week the result is published (release "source-status",
# book-status.json): the app sets aside the sources that stay down.
on:
  workflow_dispatch:
    inputs:
      langs:
        description: Languages (LNReader names, comma separated, or all)
        default: all
      only:
        description: Only these sources (comma separated names)
        default: ''
      publish:
        description: Publish the results for the app
        type: boolean
        default: false
  schedule:
    - cron: '23 4 * * 2,5'
  push:
    branches: ['claude/cleanup']
    paths: ['scripts/book-scan.cjs', '.github/workflows/book-scan.yml', 'electron/plugin-runner.cjs', 'electron/plugin-libs.cjs', 'electron/book-web.cjs']
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: App user agent
        env:
          NR_BOOK_TRACE: '1'
        run: node scripts/book-scan.cjs app.json "${{ inputs.langs || 'all' }}" "${{ inputs.only }}"
      - name: As the PC app (Chromium network, Cloudflare checks)
        env:
          NR_BOOK_TRACE: '1'
        run: |
          node node_modules/electron/install.js
          xvfb-run -a npx electron --no-sandbox scripts/book-scan.cjs pc.json "${{ inputs.langs || 'all' }}" "${{ inputs.only }}"
      - name: Publish the results for the app
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e "const r=require('./pc.json');if(r.results.length<200)throw Error('incomplete scan');require('fs').writeFileSync('book-status.json',JSON.stringify({at:r.at,results:r.results.map(x=>({id:x.id,name:x.name,lang:x.lang,state:x.verdict,detail:String(x.error||'').split(' @ ')[0].slice(0,120)}))}))"
          gh release view source-status -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create source-status -R "$GITHUB_REPOSITORY" --title "Source status" --notes "Automatic checks of the sources, read by NovelReader. Not an app release." --latest=false --prerelease
          gh release upload source-status book-status.json -R "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-scan
          path: '*.json'
