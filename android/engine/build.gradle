// Video engine for the Android app (see scripts/android-engine.py): the Aniyomi API
// and the routes of the PC engine (vendor/src, generated) + the Android parts (src/).
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

android {
    namespace 'nr.engine'
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main.java.srcDirs += ['vendor/src', 'src/main/kotlin']
    }
    lint { abortOnError false; checkReleaseBuilds false }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        freeCompilerArgs.addAll(['-Xjvm-default=all-compatibility', '-opt-in=kotlin.RequiresOptIn'])
    }
}

// Same versions as Aniyomi / Miwayomi, for binary compatibility with the extensions.
def coroutines = '1.10.1'
def serialization = '1.9.0'
def okhttp = '5.4.0'
def ktor = '3.2.3'
dependencies {
    api "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines"
    api "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines"
    api "org.jetbrains.kotlinx:kotlinx-serialization-json:$serialization"
    api "org.jetbrains.kotlinx:kotlinx-serialization-json-okio:$serialization"
    api "org.jetbrains.kotlinx:kotlinx-serialization-protobuf:$serialization"
    api "com.squareup.okhttp3:okhttp:$okhttp"
    api "com.squareup.okhttp3:logging-interceptor:$okhttp"
    api "com.squareup.okhttp3:okhttp-brotli:$okhttp"
    api "com.squareup.okio:okio:3.10.2"
    api 'io.reactivex:rxjava:1.3.8'
    api 'org.jsoup:jsoup:1.19.1'
    api 'com.github.mihonapp:injekt:91edab2317'
    api 'org.nanohttpd:nanohttpd:2.3.1'
    api 'androidx.preference:preference-ktx:1.2.1'
    api 'app.cash.quickjs:quickjs-android:0.9.2'
    implementation "io.ktor:ktor-server-core:$ktor"
    implementation "io.ktor:ktor-server-cio:$ktor"
    implementation "io.ktor:ktor-server-content-negotiation:$ktor"
    implementation "io.ktor:ktor-serialization-kotlinx-json:$ktor"
    implementation "io.ktor:ktor-server-status-pages:$ktor"
}
